startingPage:
  id: records_enquiry
  name: Make a records enquiry
  form: contact.RecordsEnquiry
  template: forms/form_page.html
  # altcha: true
  content:
    supertitle: Contact us
    breadcrumbs:
      items:
        - text: Home
          href: /
        - text: Contact us
          href: /contact-us/
    description: Use this form to email us with a specific question about records held by The National Archives or how to search for them.
    body: |
      <p>We can provide guidance on which research guides to consult and how to search our catalogue so you can carry out your own research. We cannot look at records on your behalf or identify all records that may be relevant to a particular subject.</p>
      <p>Read our guide for <a href="https://www.nationalarchives.gov.uk/explore-the-collection/the-collection-blog/getting-the-most-out-of-a-record-enquiry/">getting the most out of a research enquiry</a>, especially if you are using artificial intelligence (AI) in your research. We are unlikely to be able to respond to enquiries that do not meet our guidelines.</p>
      <p>We respond to enquiries submitted using this form within 10 working days.</p>
    beforeSubmit: |
      <p>
        <small>The National Archives only records personal information, including email addresses, for the purposes provided. We will not share your details with third parties. For more information read our <a href="/terms-and-conditions/privacy-notice/">privacy policy</a>.</small>
      </p>
    submitButtonText: Submit
  extraAssets:
    css:
      - make-a-records-and-research-enquiry.css
  redirectWhenComplete:
    - page: final_page

finalPage:
  id: final_page
  name: Enquiry submitted
  slug: complete
  content:
    panelTitle: Enquiry submitted
    body: |
      <p>Thank you for taking the time to make a records enquiry. We respond to enquiries submitted using this form within 10 working days.</p>
    submitAgainButtonText: Submit another enquiry
  template: forms/final.html
  requires:
    - records_enquiry
  resultHandlers:
    - type: email
      details:
        process:
          templateString: |
            <enquiry_id>{{ reference_number | escape }}</enquiry_id>
            <title></title>
            <first_name>{{ data.records_enquiry.name.first_name | escape }}</first_name>
            <last_name>{{ data.records_enquiry.name.surname | escape }}</last_name>
            <contact_email>{{ data.records_enquiry.email | escape }}</contact_email>
            <enquiry>{{ data.records_enquiry.enquiry | escape }}</enquiry>
            <contact_country>{{ data.records_enquiry.country | escape }}</contact_country>
          html: false
        send:
          toConfigVar: FORM_RECORDS_ENQUIRY_INBOX
          subject: "? FOI DIRECT GENAA"
    # - type: dynamics

meta:
  exclude_from_sitemap: true

startingPage:
  id: start
  name: Testing email completion
  form: EmailForm
  minimumTimeToComplete: 0
  redirectWhenComplete:
    - page: final

finalPage:
  id: final
  name: Final
  slug: final
  template: forms/test/static.html
  requires:
    - start
  resultHandlers:
    - type: email
      details:
        process:
          templateString: "{{ data | tojson }}"
        send:
          toVar: data.start.email_address
          subject: Test completion email

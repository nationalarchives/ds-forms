name: Run Playwright tests

runs:
  using: "composite"
  steps:
    - name: Install test dependencies
      run: npm ci
      shell: bash
    - name: Start service
      run: docker compose up --detach --wait --wait-timeout 300 app || docker compose logs app
      shell: bash
    - name: Run tests
      run: CI=true npx playwright test --grep-invert "@wip"
      shell: bash
